[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-system"
version = "0.1.0"
description = "Autonomous multi-LLM orchestration system using LangGraph"
requires-python = ">=3.11"
dependencies = [
    # LangGraph and LangChain core
    "langgraph>=0.2.45",
    "langchain-core>=0.3.21",
    "langchain>=0.3.7",

    # LLM integrations
    "langchain-anthropic>=0.2.5",
    "langchain-openai>=0.2.9",
    "langchain-ollama>=0.2.1",

    # Computer control
    "pyautogui>=0.9.54",
    "pillow>=10.4.0",
    "pyscreeze>=1.0.1",

    # Browser automation
    "playwright>=1.48.0",

    # Configuration and settings
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",

    # Logging
    "structlog>=24.4.0",

    # Error handling
    "tenacity>=9.0.0",

    # Utilities
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
